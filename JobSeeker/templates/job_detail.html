{% extends 'js_base.html' %}
<title>{% block title %} Job Detail{% endblock %}</title>
<h3>{% block pageTitle %} Job Detail{% endblock %}</h3>
{% block content %}
<div class="container-fluid py-4">
    <div class="d-flex justify-content-start col-12 js-breadcrumb mb-5">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="{% url 'js-home' %}"> <i class="fi fi-rr-home me-2"></i>Home</a></li>
                <li class="breadcrumb-item active" aria-current="page"><a href="#" id="job-breadcrumb"></a></li>
            </ol>
        </nav>
    </div>
    <div class="row g-4">

        <!-- LEFT SIDE - JOB DETAILS -->
        <div class="col-lg-8">
            <div class="card shadow-sm border-0 rounded-4 p-4">

                <div class="row g-4  d-flex justify-content-between">
                    <div class="col-8">
                        <h3 id="job-title" class="fw-bold mb-3"></h3>
                    </div>
                    <div class="col-3">
                        <button class="btn btn-primary p-3 w-100">Apply</button>
                    </div>
                </div>

                <div class="mb-3 text-muted">
                    <div class="mb-2">
                    <i class="fi fi-sr-marker me-2"></i><span id="job-location"></span>
                    </div>
                    <div class="mb-2">
                    <i class="fi fi-rr-employee-man-alt me-2"></i><span id="job-type"></span>
                    </div>
                    <i class="fi fi-rr-briefcase me-2"></i><span id="job-experience"></span>
                </div>

                <hr>

                <h5 class="fw-semibold mt-3">Job Description</h5>
                <p id="job-description" class="text-muted mt-2"></p>

                <h5 class="fw-semibold mt-4">Salary</h5>
                <p id="job-salary"></p>

            </div>
        </div>

        <!-- RIGHT SIDE - COMPANY DETAILS -->
        <div class="col-lg-4">
            <div class="card shadow-sm border-0 rounded-4 p-4">

                <h5 class="fw-bold mb-3">Company Details</h5>

                <p><strong>Name:</strong> <span id="company-name"></span></p>
                <p><strong>Website:</strong> <span id="company-website"></span></p>
                <p><strong>Email:</strong> <span id="company-email"></span></p>
                <p><strong>Description:</strong></p>
                <p id="company-description" class="text-muted"></p>

            </div>
        </div>

    </div>
</div>

{% endblock %}
{% block script %}
<script>

    document.addEventListener("DOMContentLoaded", function () {

        const jobId = {{ job_id }};

    async function fetchJobDetail() {
        try {
            const response = await fetch(`/company/api/jobs/${jobId}/`);
            const job = await response.json();

            // Fill Job Details
            document.getElementById("job-breadcrumb").innerText = job.job_title;
            document.getElementById("job-title").innerText = job.job_title;
            document.getElementById("job-location").innerText = job.location;
            document.getElementById("job-type").innerText = job.job_type;
            document.getElementById("job-experience").innerText = job.required_experience;
            document.getElementById("job-description").innerText = job.job_description;
            document.getElementById("job-salary").innerText = job.salary;
            

            // Fill Company Details
            document.getElementById("company-name").innerText = job.company.company_name;
            document.getElementById("company-website").innerText = job.company.website;
            document.getElementById("company-email").innerText = job.company.email;
            document.getElementById("company-description").innerText = job.company.description;

        } catch (error) {
            console.error("Error loading job details:", error);
        }
    }

    fetchJobDetail();
});

</script>
{% endblock %}
