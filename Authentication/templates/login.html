{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
    <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/uicons-regular-rounded/css/uicons-regular-rounded.css">

</head>

<body>
    <div class="container-fluid auth-background">


        <div class="auth-card text-center px-5 py-4 d-flex align-items-center flex-column">

            <div class="avatar"></div>

            <h3>Welcome</h3>
            <p class="sub-heading">Please enter your details to sign in</p>


            <!-- ✅ DJANGO ALERTS -->
            {% if messages %}
            {% for message in messages %}
            <div class="alert 
            {% if message.tags == 'error' %}
                alert-danger
            {% elif message.tags == 'success' %}
                alert-success
            {% else %}
                alert-info
            {% endif %}
            alert-dismissible fade show" role="alert">

                {{ message }}

                <button type="button" class="btn-close" data-bs-dismiss="alert">
                </button>
            </div>
            {% endfor %}
            {% endif %}


            <form method="POST" action="{% url 'login' %}" class="text-start my-4 mx-5 w-100 auth-form">
                {% csrf_token %}

                <div class="mb-3">
                    <label>Email address</label>
                    <input type="text" name="username" class="form-control" required>
                </div>

                <div class="mb-4">
                    <label>Password</label>
                    <!-- <input type="password" name="password" class="form-control" required> -->
                    <div class="input-group">
                        <input type="password" name="password" id="password" class="form-control" required>

                        <span class="input-group-text" style="cursor: pointer;"
                            onclick="togglePassword('password', this)">
                            <i class="fi fi-rr-eye"></i>
                        </span>
                    </div>
                </div>

                <button type="submit" class="btn auth-btn w-100">
                    Login
                </button>

                <div class="text-center mt-4 auth-bottom-text">
                    Don't have an account yet? <a href="{% url 'signup' %}">Sign Up</a>
                </div>

            </form>

        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- ✅ Auto Hide Alerts -->
    <script>
        setTimeout(function () {
            let alerts = document.querySelectorAll(".alert");
            alerts.forEach(alert => {
                alert.style.display = "none";
            });
        }, 3500);
    </script>
    <script src="{% static 'js/main.js' %}"></script>

</body>

</html>
