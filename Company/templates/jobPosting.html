{% extends 'c-base.html' %}

{% block title %}Post a Job{% endblock %}
{% block pageTitle %}Post a Job{% endblock %}

{% block content %}

<div class="post-job-container">

    <form method="POST">
        {% csrf_token %}

        <!-- Job Title & Location -->
        <div class="form-row">
            <input type="text" name="job_title" placeholder="Job Title" required>
            <input type="text" name="location" placeholder="Location" required>
        </div>

        <!-- Experience Field -->
        <div class="form-row single">
            <input type="text" name="required_experience" 
                   placeholder="Required Experience (Eg: 3-5 years)" required>
        </div>

        <!-- Employment Type & Salary -->
        <div class="form-row">
            <select name="job_type" class="employment-type" required>
                <option value="">Employment Type</option>
                <option value="full_time">Full-time</option>
                <option value="part_time">Part-time</option>
                <option value="contract">Contract</option>
                <option value="internship">Internship</option>
                <option value="remote">Remote</option>
            </select>

            <input type="text" name="salary" placeholder="Salary Range">
        </div>

        <!-- Deadline Datepicker -->
        <div class="form-row single">
            <input type="date" name="deadline" required>
        </div>

        <!-- Skills -->
        <div class="form-row single">
            <input type="text" name="skills_required" 
                   placeholder="Required Skills (Eg: Django, React)">
        </div>

        <!-- Description -->
        <div class="form-row single">
            <textarea name="job_description" rows="4" 
                      placeholder="Job Description" required></textarea>
        </div>

        <!-- Button -->
        <div class="form-row single center-btn">
            <button type="submit" class="post-btn">Post Job</button>
        </div>

    </form>
</div>

{% endblock %}
